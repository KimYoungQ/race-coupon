# 나머지 설정(라우트·springdoc·actuator·logging)은 config-service가
# config/apigateway.yml + config/application.yml로 내려준다.
#
# configserver에 optional:을 붙이지 않는다 — config-service가 없으면 조용히 뜨는 대신 기동을 실패시킨다.
# profiles.active는 SPRING_PROFILES_ACTIVE 환경변수나 --spring.profiles.active로 덮인다.
server:
  port: 8080  # 외부 진입점. 클라이언트는 이 포트로만 요청한다.

spring:
  application:
    name: apigateway
  profiles:
    active: local
  config:
    import: "configserver:http://localhost:8888"
