# 나머지 설정(라우트·springdoc·actuator·logging)은 config-service가
# config/apigateway.yml + config/application.yml로 내려준다.
# 여기 남는 것은 (1) 포트 — 외부 진입점이라 로컬에서 바로 보여야 한다,
# (2) .env — 내려받은 설정의 ${JWT_SECRET} 플레이스홀더를 이 서비스가 직접 해석해야 하기 때문이다.
server:
  port: 8080

spring:
  config:
    import: "optional:file:.env[.properties]"
