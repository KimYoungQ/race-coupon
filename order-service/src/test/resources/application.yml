spring:
  application:
    name: order-service-test

  cloud:
    config:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: []

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-saga
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.coupon.common.event

saga:
  listener:
    auto-startup: false

jwt:
  secret: test-only-secret-key-for-hs256-minimum-32-bytes

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      coupon-service:                                   # config/order-service.yml 과 같은 값
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
        ignore-exceptions:
          - org.coupon.common.exception.BusinessException

logging:
  level:
    root: WARN
    org.coupon.orderservice: INFO

management:
  tracing:
    sampling:
      probability: 1.0            # 테스트가 스팬을 읽어야 하므로 전부 샘플링한다
    export:
      otlp:
        enabled: false            # 테스트에서 Jaeger(4318)로 스팬을 보내지 않는다.
                                  # 전역 키 management.tracing.export.enabled 를 끄면
                                  # W3C TextMapPropagator 까지 @ConditionalOnEnabledTracingExport 로 꺼져
                                  # traceparent 전파 자체가 죽는다. 그래서 OTLP 전송만 골라서 끈다.
                                  # (추적을 켜지 않는 평범한 @SpringBootTest 는 spring-boot-micrometer-tracing-test 가
                                  #  전역 키를 알아서 false 로 넣어 주므로 어차피 아무것도 나가지 않는다.)
  defaults:
    metrics:
      export:
        enabled: false            # micrometer-registry-otlp 이 4318 로 지표를 보내는 것도 함께 막는다
