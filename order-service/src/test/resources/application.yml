spring:
  application:
    name: order-service-test

  cloud:
    config:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: []

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-saga
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.coupon.common.event

saga:
  listener:
    auto-startup: false

jwt:
  secret: test-only-secret-key-for-hs256-minimum-32-bytes

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      coupon-service:                                   # config/order-service.yml 과 같은 값
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
        ignore-exceptions:
          - org.coupon.common.exception.BusinessException

logging:
  level:
    root: WARN
    org.coupon.orderservice: INFO
