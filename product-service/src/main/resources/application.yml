# 나머지 설정은 config-service가 config/product-service.yml + config/application.yml로 내려준다.
#
# import 순서대로 읽는다. .env가 먼저 있어야 config-service가 리터럴로 내려보낸
# ${JWT_SECRET}·${MYSQL_PASSWORD}를 이 서비스가 해석할 수 있다.
# configserver에 optional:을 붙이지 않는다 — config-service가 없으면 조용히 뜨는 대신 기동을 실패시킨다.
server:
  port: ${PRODUCT_SERVICE_PORT:8083}
  servlet:
    context-path: ""

spring:
  application:
    name: product-service
  config:
    import:
      - "optional:file:.env[.properties]"
      - "configserver:${CONFIG_URI:http://localhost:8888}"
