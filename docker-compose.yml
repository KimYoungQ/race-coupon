services:
  mysql:
    image: mysql:8.0
    container_name: coupon-mysql
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: coupon_service
      # docker/mysql/init/init.sql의 GRANT 대상이 'cpuser'@'%'로 고정돼 있다.
      MYSQL_USER: cpuser
      MYSQL_PASSWORD: cppass
      TZ: Asia/Seoul
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake

  redis:
    image: redis:7-alpine
    container_name: coupon-redis
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: coupon-rabbitmq
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-1:
    image: apache/kafka:3.8.0
    container_name: coupon-kafka-1
    hostname: kafka-1
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      - "9092:9092"
    environment:
      # 3노드가 같은 값을 공유해야 한다. 다르면 각자 다른 클러스터로 포맷되어 quorum이 형성되지 않는다.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 리스너 3개:
      #   - PLAINTEXT://:9092       → 외부(호스트) 접속용
      #   - INTERNAL://:29092       → 도커 네트워크 내부(inter-broker, Kafka UI, kafka-init)
      #   - CONTROLLER://:9093      → KRaft quorum
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      # PLAINTEXT에는 호스트 publish 포트를 적는다. 아래 ports 매핑과 반드시 짝을 이룬다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka-1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      # acks=all의 의미를 결정하는 값. 1이면 acks=all이 사실상 acks=1이 된다.
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      # 이미지 기본값은 /tmp/kraft-combined-logs다. 볼륨 마운트 지점과 맞춘다.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-2:
    image: apache/kafka:3.8.0
    container_name: coupon-kafka-2
    hostname: kafka-2
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      - "9192:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9192,INTERNAL://kafka-2:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-3:
    image: apache/kafka:3.8.0
    container_name: coupon-kafka-3
    hostname: kafka-3
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      - "9292:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9292,INTERNAL://kafka-3:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # 토픽 9개(사가 4 + 발급 1 + DLT 4)를 만든다.
  # auto-create를 껐으므로 이 컨테이너가 토픽 형상의 정본이다.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: coupon-kafka-init
    restart: "no"
    networks: [ coupon-net ]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic product-request --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic product-response --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic coupon-request --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic coupon-response --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic coupon-issue --partitions 3 --replication-factor 3 --config min.insync.replicas=2

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic product-request.DLT --partitions 3 --replication-factor 3 --config min.insync.replicas=1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic product-response.DLT --partitions 3 --replication-factor 3 --config min.insync.replicas=1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic coupon-request.DLT --partitions 3 --replication-factor 3 --config min.insync.replicas=1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists --topic coupon-response.DLT --partitions 3 --replication-factor 3 --config min.insync.replicas=1

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: coupon-kafka-ui
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      # 8080은 apigateway, 8081은 coupon-service가 쓴다.
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: coupon-cluster
      # 3대를 다 적는다. 1대를 죽여도 UI가 붙어 있어야 장애 주입을 관찰할 수 있다.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  # Jaeger v2는 OTLP가 네이티브다. v1 all-in-one의 COLLECTOR_OTLP_ENABLED에 해당하는
  # 활성화 플래그가 없으므로 environment 없이 그대로 4317/4318로 받는다.
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    container_name: coupon-jaeger
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      # Spring 서비스는 컨테이너가 아니라 호스트에서 뜨므로 OTLP 포트를 publish해야 한다.
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP — 서비스가 쓰는 쪽(Boot 기본 transport가 HTTP)
      # 8080~8084는 앱, 8090은 kafka-ui가 쓴다.
      - "16686:16686"  # UI

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: coupon-prometheus
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus-data:/prometheus
    # Spring 서비스가 컨테이너 밖(호스트)에서 뜨므로 host.docker.internal로 되짚어야 한다.
    # Docker Desktop은 이 이름을 기본 제공하지만 Linux 데몬은 아니다. 명시해 두면 양쪽에서 동작한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      # 이게 있어야 알림 규칙을 추가할 때 컨테이너 재생성 없이
      # curl -X POST http://localhost:9090/-/reload 로 반영된다.
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: coupon-grafana
    restart: unless-stopped
    networks: [ coupon-net ]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # 데이터소스를 파일로 고정한다. UI에서 등록하면 컨테이너를 recreate할 때마다 사라진다.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    environment:
      # 로컬 전용 자격증명. 운영에 그대로 쓰지 말 것 — jwt.secret과 같은 취급이다.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    depends_on:
      - prometheus

# MySQL·Redis에는 볼륨을 두지 않는다(recreate = 테스트 초기화라 그게 이득이다).
# 관측 데이터는 성격이 반대다 — 날아가면 벤치마크 전후 비교라는 목적 자체가 사라진다.
volumes:
  prometheus-data:
  grafana-data:

networks:
  coupon-net:
    name: coupon-net
