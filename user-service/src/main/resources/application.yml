# 나머지 설정은 config-service가 config/user-service.yml + config/application.yml로 내려준다.
# 여기 남는 것은 (1) 포트 — 기동 실패 시 원인 파악용, (2) .env — 내려받은 설정의
# ${JWT_SECRET}·${MYSQL_PASSWORD} 플레이스홀더를 이 서비스가 직접 해석해야 하기 때문이다.
server:
  port: ${USER_SERVICE_PORT:8082}

spring:
  config:
    import: "optional:file:.env[.properties]"
