server:
  port: ${USER_SERVICE_PORT:8082}

spring:
  application:
    name: user-service
  config:
    import: "optional:file:.env[.properties]"

  # Datasource (MySQL) — Database per Service: coupon_service와 분리된 user_service 스키마
  datasource:
    url: "jdbc:mysql://localhost:3306/user_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate — 계정은 재기동에도 살아남아야 하므로 update
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Eureka (service discovery) — 게이트웨이가 lb://user-service 로 발견
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# JWT — 게이트웨이와 반드시 같은 secret. 유효시간(초): Access 30분, Refresh 7일
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800
  refresh-token-validity: 604800

# Logging
logging:
  level:
    root: INFO
    org.coupon.userservice: DEBUG
    org.springframework.security: DEBUG
