plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'org.coupon'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // logback-spring.xml의 JSON_FILE appender(LogstashEncoder)가 쓴다.
        // 7.x는 Logback 1.3/1.4 대상이다. 이 프로젝트는 1.5.34라 8.x를 쓴다.
        implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // record 컴포넌트 이름을 클래스파일에 남긴다. common은 java-library만 적용돼
        // Boot 플러그인이 자동으로 넣어주는 -parameters가 빠지는데, 그러면 common/event의
        // record가 arg0, arg1로 바인딩돼 Kafka JSON 역직렬화가 실패한다.
        options.compilerArgs << '-parameters'
    }

    tasks.named('test') {
        useJUnitPlatform()
        systemProperty 'file.encoding', 'UTF-8'
    }
}
