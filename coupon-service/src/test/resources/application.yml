# 테스트 전용 설정 — 외부 MySQL/.env 의존 제거(H2 인메모리)
spring:
  application:
    name: coupon-service-test

  # H2 인메모리 (MySQL 호환 모드)
  datasource:
    url: "jdbc:h2:mem:coupon;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # data.sql 비활성 — 동시성 테스트는 @BeforeEach에서 직접 시드한다
  sql:
    init:
      mode: never

  # Redis — RedisCouponIssueServiceTest / KafkaCouponIssueServiceTest가 사용(로컬 도커 필요)
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka — KafkaCouponIssueServiceTest는 @EmbeddedKafka가 bootstrap을 주입(아래는 그 외 테스트용 기본값)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: coupon-issue
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.coupon.couponservice.kafka
    listener:
      ack-mode: manual

# JWT — 운영 키와 무관한 테스트 전용 더미. 값은 있어야 한다(HS256 최소 32바이트).
jwt:
  secret: test-only-secret-key-for-hs256-minimum-32-bytes

# Logging
logging:
  level:
    root: WARN
    org.coupon.couponservice: INFO
