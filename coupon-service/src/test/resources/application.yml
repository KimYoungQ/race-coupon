spring:
  application:
    name: coupon-service-test

  cloud:
    config:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: []

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: coupon-issue
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.coupon.couponservice.kafka,org.coupon.common.event
    listener:
      ack-mode: manual
      auto-startup: false   # 테스트는 브로커 없이 컨슈머 메서드를 직접 호출한다

saga:
  listener:
    auto-startup: false

jwt:
  secret: test-only-secret-key-for-hs256-minimum-32-bytes

management:
  tracing:
    export:
      otlp:
        enabled: false          # 테스트에서는 스팬을 Jaeger(4318)로 보내지 않는다. Tracer 자체는 살아 있다.
                                # 전역 키(management.tracing.export.enabled)를 쓰면 안 된다. 그 키는 W3C
                                # 전파기 빈까지 함께 꺼서 outbox 의 traceparent 가 null 로 저장된다.
  defaults:
    metrics:
      export:
        enabled: false          # micrometer-registry-otlp 이 4318 로 지표를 보내는 것도 함께 막는다

logging:
  level:
    root: WARN
    org.coupon.couponservice: INFO
