spring:
  application:
    name: coupon-service-test

  cloud:
    config:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: []

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: coupon-issue
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.coupon.couponservice.kafka,org.coupon.common.event
    listener:
      ack-mode: manual

coupon-service:
  saga:
    listener:
      auto-startup: false

jwt:
  secret: test-only-secret-key-for-hs256-minimum-32-bytes

logging:
  level:
    root: WARN
    org.coupon.couponservice: INFO
