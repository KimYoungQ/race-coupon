# 환경 무관 base. 접속 주소·자격증명·스키마 정책은 order-service-{profile}.yml에 있다.
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: OrderHikariCP
      # 배경 스레드만 10개다 — 리스너 2개×concurrency 3 + 스케줄러 pool 4.
      # 기본 풀(10)이면 웹 요청이 커넥션을 받지 못해 connection-timeout까지 기다린다.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # Kafka — Saga 오케스트레이터: 커맨드 발행, 리플라이 소비
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      compression-type: zstd
      properties:
        linger.ms: 0
        enable.idempotence: true
        # 브로커 기본 replica.lag.time.max.ms(30초)보다 크게 둔다.
        # 짧으면 브로커 1대 정지 직후 ISR 수축 창에서 프로듀서가 흡수할 수 있는
        # 일시 장애가 확정 실패로 바뀌고, Outbox가 같은 row를 계속 다시 집는다.
        request.timeout.ms: 5000
        delivery.timeout.ms: 45000
        # send()가 메타데이터를 못 얻을 때 호출 스레드를 붙잡는 시간. 기본 60초.
        max.block.ms: 3000
        retry.backoff.ms: 200
    consumer:
      group-id: order-saga
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # 배치 리스너 + AckMode.BATCH라 한 배치를 다 처리해야 커밋된다.
      # 기본 500이면 실패 시 재처리 범위와 DB 트랜잭션 점유가 커진다.
      max-poll-records: 100
      properties:
        spring.json.trusted.packages: org.coupon.common.event
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        max.poll.interval.ms: 300000
        allow.auto.create.topics: false
    listener:
      ack-mode: manual
      concurrency: 3

  # Outbox 스케줄러들이 기본 풀(스레드 1개)에 몰리면 서로를 막는다.
  task:
    scheduling:
      pool:
        size: 4

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

# Outbox 발행 재시도 주기. 정상 경로는 커밋 직후 즉시 발행되므로 이 스케줄러가 집는 것은
# "발행에 실패했거나 발행 전에 프로세스가 죽은" row뿐이다.
#
# 재고/쿠폰 채널이 이 값을 공유한다. 한쪽만 다르게 하려면 아래처럼 덮는다.
#   order-service.outbox.product.fixed-delay
#   order-service.outbox.coupon.fixed-delay
order-service:
  outbox:
    fixed-delay: 5000
    initial-delay: 10000
