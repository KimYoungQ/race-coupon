spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: OrderHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      compression-type: zstd
      properties:
        linger.ms: 0
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 45000
        max.block.ms: 3000
        retry.backoff.ms: 200
    consumer:
      group-id: order-saga
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 100
      properties:
        spring.json.trusted.packages: org.coupon.common.event
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        max.poll.interval.ms: 300000
        allow.auto.create.topics: false
    listener:
      ack-mode: manual
      concurrency: 3

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  sql:
    init:
      mode: always
      encoding: UTF-8

  cloud:
    openfeign:
      client:
        config:
          default:                    # 모든 Feign 클라이언트 공통 설정
            connect-timeout: 2000     # 2초
            read-timeout: 5000        # 5초

resilience4j:
  circuitbreaker:
    instances:
      coupon-service:                                   # CouponChecker 의 @CircuitBreaker(name) 과 같아야 한다
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10                         # 최근 10건 기준
        minimum-number-of-calls: 5                      # 5건은 모여야 실패율을 계산한다
        failure-rate-threshold: 50                      # 실패율 50% 이상이면 열린다
        wait-duration-in-open-state: 10s                # 열린 뒤 10초 후 half-open
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException                        # 연결 실패·타임아웃(RetryableException)·5xx
        ignore-exceptions:
          - org.coupon.common.exception.BusinessException   # 쿠폰 서비스가 멀쩡히 답한 4xx 는 실패가 아니다
