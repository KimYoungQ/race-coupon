# Saga/Outbox 검증 profile. 근거는 config/order-service-saga-test.yml 참조.
#
# 발급 메시지 재소비 멱등 시나리오(같은 메시지 2회 → IssuedCoupon 1건)도 이 profile에서 본다.
# create로 띄우면 UNIQUE(user_id, coupon_id)가 매번 새로 만들어져 재소비 자체를 재현할 수 없다.
spring:
  jpa:
    hibernate:
      ddl-auto: update
  # data.sql이 매 기동마다 다시 돌면 update 모드에서 쿠폰이 중복 적재된다.
  sql:
    init:
      mode: never
