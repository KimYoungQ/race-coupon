spring:
  jackson2:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

eureka:
  client:
    refresh:
      enable: false
  instance:
    prefer-ip-address: true

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, loggers, metrics, prometheus, env, refresh, busrefresh, gateway
        exclude: shutdown

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

  otlp:
    metrics:
      export:
        enabled: false
