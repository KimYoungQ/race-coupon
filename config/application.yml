# 모든 서비스의 공통 base. 환경에 따라 달라지는 값은 여기 두지 않는다 —
# 접속 주소·자격증명·스키마 정책은 application-{profile}.yml이 담당한다.
#
# config/*-prod.yml은 .gitignore 대상이라 새로 클론한 환경에는 없다. base에 접속 정보가
# 남아 있으면 prod로 띄웠을 때 그 값이 그대로 적용되므로, 여기에는 절대 두지 않는다.
spring:
  # 프리픽스가 spring.jackson 이 아니라 spring.jackson2 다.
  # Boot 4.1은 Jackson이 두 벌이다 — starter-webmvc가 Jackson 3(tools.jackson.*, spring.jackson.*),
  # eureka-client가 끌고 오는 spring-boot-jackson2가 Jackson 2(com.fasterxml.*, spring.jackson2.*)다.
  # 누가 spring.jackson 으로 "고치지" 않도록 이 주석을 지우지 말 것.
  #
  # 주의: 이 설정은 컨텍스트의 Jackson 2 ObjectMapper 빈에만 적용된다.
  # spring-kafka의 JsonSerializer/JsonDeserializer는 Kafka 클라이언트가 클래스명으로
  # 리플렉션 생성하므로 JacksonUtils.enhancedObjectMapper()로 자기 매퍼를 따로 만든다 —
  # 여기 설정이 도달하지 않는다. Saga payload 직렬화는 SagaJacksonConfig의 전용 매퍼가 담당한다.
  jackson2:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

eureka:
  client:
    refresh:
      enable: false
  instance:
    prefer-ip-address: true

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, env, refresh, busrefresh

  # 프리픽스가 management.otlp.tracing 이 아니라 management.opentelemetry.tracing.export.otlp 다.
  # Boot 3.x는 management.otlp.tracing.endpoint 였고 4.x에서 이 경로로 옮겨졌다.
  # 검색으로 나오는 자료는 대부분 3.x 기준이고, 바로 아래 management.otlp.metrics 와 짝이
  # 안 맞아 보여서 "일관성 있게" 되돌리기 쉽다. 되돌리면 exporter가 조용히 기본 엔드포인트로
  # 붙어 Jaeger에 아무것도 안 들어온다. 이 주석을 지우지 말 것.
  # (endpoint 값 자체는 환경마다 다르므로 application-{profile}.yml에 있다)

  # 메트릭 쪽은 tracing과 달리 프리픽스가 그대로다(management.otlp.metrics). 위 주석 참조.
  # starter-opentelemetry가 micrometer-registry-otlp까지 끌고 오는데 Jaeger는 트레이스만 받는다.
  # 끄지 않으면 step 주기마다 /v1/metrics 실패 로그가 쌓인다.
  otlp:
    metrics:
      export:
        enabled: false
