spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/coupon_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    username: cpuser
    password: cppass

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092,localhost:9192,localhost:9292

  # 매 기동마다 스키마를 새로 만든다. 운영에서는 절대 이 값이면 안 되므로 base가 아니라 여기 둔다.
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      platform: mysql
      encoding: UTF-8
