# Saga/Outbox 검증 profile. 근거는 config/order-service-saga-test.yml 참조.
#
# 응답 발행 직전 kill -9 → 재기동 후 재발행 시나리오를 보려면 order_outbox 테이블과
# 그 안의 row가 재기동을 넘어 살아남아야 한다.
spring:
  jpa:
    hibernate:
      ddl-auto: update
  # data.sql이 매 기동마다 다시 돌면 update 모드에서 상품이 중복 적재된다.
  sql:
    init:
      mode: never
