spring:
  # Database per Service: coupon_service와 분리된 user_service 스키마
  datasource:
    url: "jdbc:mysql://localhost:3306/user_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    username: cpuser
    password: cppass

  # 매 기동마다 스키마를 새로 만든다. 운영에서는 절대 이 값이면 안 되므로 base가 아니라 여기 둔다.
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
